name: list_tree
description: >
  List files and directories at the selected relative path, up to depth four
  and 200 entries. On an artifact step's first pass, the current candidate overlays the project.
  During a true revision, list only the complete candidate so deletions remain absent.
  Otherwise search the project, current outputs and published outputs.
  Returns tree, entry_count and found_in.

parameters:
  path:
    type: string
    description: "Relative directory to list (optional, default root)"
    required: false
  depth:
    type: integer
    description: "Max depth to expand (optional, default 3, max 4)"
    required: false
limits:
  max_entries: 200
  max_depth: 4
