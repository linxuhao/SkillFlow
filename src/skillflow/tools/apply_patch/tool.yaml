name: apply_patch
output:
  target: code
description: |
  Apply strict text edits directly in this run's code worktree. Two ways to
  address an edit; use either, or both in one call. Everything is checked
  before anything is written.

  REFERENCE MODE (`references`) — PREFER THIS FOR EXISTING FILES.
  Every `read` hands back a `citation`: {path, start_line, end_line, start_byte,
  end_byte, sha}. The sha is issued by the engine over exactly the text that
  read sent you. Quote it back and supply ONLY the new text; the engine does
  the copying. You never retype the original, so you never have to wonder
  whether your copy of it is still accurate.
  Address the edit with the fewest numbers that say what you mean; every
  number you leave out is taken from the citation, not counted by you:
    Replace exactly what that read served — no line or column numbers:
      references: [{"file": "src/a.py", "sha": "<the sha that read returned>",
                    "new_text": "    return 2"}]
    Replace whole lines L..M inside a wider window — the line numbers the read
    printed in its margin, still no columns:
      references: [{"file": "src/a.py", "sha": "<sha>", "from_line": 120,
                    "to_line": 123, "new_text": "    return 2"}]
    Cut INSIDE a line — only then add columns:
      references: [{"file": "src/a.py", "sha": "<sha>", "from_line": 120,
                    "from_col": 11, "to_line": 120, "to_col": 12,
                    "new_text": "7"}]
  Lines are 1-based and must lie inside the cited window; give both or
  neither. Columns are 0-based character offsets, `to_col` exclusive, and are
  honoured exactly as written: a column one short of the line's end keeps the
  line's last character. So to replace a whole line, omit the columns rather
  than counting them; from == to inserts at a point. The result's `replaced`
  says what each reference took out. Order does not matter and you never
  compensate for line drift: every range in one call is resolved against the
  same snapshot and the engine applies them. Ranges must not overlap. To
  change one line, read or cite just that line — a reference is a hunk, not a
  file rewrite.
  A sha this run's `read` did not issue is refused, and so is a cited window
  whose text has changed since: reread the range and cite the new sha. There
  is no fuzzy matching and no partial write.

  V4A MODE (`patch`) — for Add and Delete, and for edits you would rather
  express as a diff. Updates match exactly one occurrence of their context
  against the ORIGINAL file, with ordered, non-overlapping hunks.
  Format (literal prefixes, bare @@ only):
  *** Begin Patch
  *** Update File: src/example.py
  @@
   def answer():
  -    return 1
  +    return 2
  *** Add File: tests/new_test.py
  +assert answer() == 2
  *** Delete File: obsolete.txt
  *** End Patch
  Each hunk line starts with space (unchanged), - (remove) or + (add).
  Include unique unchanged context for insertion into a nonempty file. Add
  refuses existing files; Delete requires an existing regular file and takes
  no body. If a hunk comes back stale or ambiguous, switch that edit to
  reference mode — read the range, cite its sha — rather than widening the
  copied context.

  Common to both: repo-relative paths only; no .git, symlinks, traversal or
  caller-selected roots. A file may appear in `patch` or in `references`, not
  both. Maximum 128 files, 1024 hunks or references per file, 2 MiB of patch
  text and 2 MiB of references, 16 MiB per file and 64 MiB combined preflight
  content. Validation and review still gate delivery. On an I/O failure,
  inspect partial/written/deleted and reread those files; do not blindly
  replay the batch. UTF-8 updates preserve LF/CRLF and the existing EOF
  newline; Add uses LF with a final newline (no content lines creates an empty
  file). Mixed line endings, move/rename, numbered/anchored @@ and EOF markers
  are unsupported and refused.
parameters:
  patch:
    type: string
    required: false
    description: Begin/End Patch text for Add/Delete operations and diff-shaped updates. Omit when every edit is a reference.
  references:
    type: array
    required: false
    description: >
      Reference hunks. Each is {file, sha, new_text}, optionally narrowed by
      from_line/to_line (whole lines) and then from_col/to_col (a cut inside a
      line), and carries no original text — the sha, issued by this run's
      read, is what identifies it; with no lines it replaces the whole cited
      window. Any order; the engine resolves them against one snapshot.
