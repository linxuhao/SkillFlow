name: write
description: >
  Write content to a file in the project workspace.
parameters:
  file:
    type: string
    description: "Repo-relative path (e.g. 'index.html', 'src/pkg/main.py'). Nested paths are allowed and parent dirs are created; a leading 'project/' is stripped."
    required: true
  content:
    type: string
    description: "File content to write"
    required: true
