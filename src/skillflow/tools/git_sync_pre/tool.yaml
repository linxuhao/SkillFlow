name: git_sync_pre
description: >
  Pre-pipeline git sync policy check. Skips for non-git repos, linked run
  worktrees, the default policy and local-only repos. policy "pull" with a
  remote reports synced=false/action=unavailable: fetch/pull would run
  repository-configured programs in the engine, which the closed Git policy
  refuses. Nothing is fetched or changed.
parameters:
  project_root:
    type: string
    description: "Path to the project repository"
    required: true
