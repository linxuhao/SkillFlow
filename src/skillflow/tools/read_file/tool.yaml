name: read_file
description: >
  Read a file from the project workspace. Searches in order:
  1) the current run worktree, including uncommitted edits,
  2) this step's current artifact files,
  3) this step's published artifacts from prior attempts.
  Returns the file content with line numbers, and indicates which
  directory the file was found in ("found_in"). Returns the WHOLE file
  unless start_line/end_line are given; no size cap, no truncation flag.
  On an artifact step's first pass, the current candidate overlays the repo; during a true revision, reads use only the complete candidate so deletions remain absent.
parameters:
  path:
    type: string
    description: "Relative path from project root (e.g. 'src/main.py')"
    required: true
  start_line:
    type: integer
    description: "0-indexed start line (optional, default 0)"
    required: false
  end_line:
    type: integer
    description: "Exclusive end line (optional, default end of file)"
    required: false
